# Experiment parameters only.
# Environment-specific paths and credentials are in .env (see .env.example).

agent:
  model: qwen3.5-35b-a3b
  max_steps: 32
  min_steps: 4
  temperature: 0.0

run:
  # 3-attempt union (T=0.6/0.6/0.7); workers=4 × 3 = 12 vLLM streams.
  # vLLM saturates at ~13-15 concurrent streams; 12 is the safe ceiling.
  max_workers: 4
  task_timeout_seconds: 900
