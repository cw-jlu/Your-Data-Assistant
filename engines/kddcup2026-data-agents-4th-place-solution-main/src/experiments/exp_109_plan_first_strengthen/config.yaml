# Experiment parameters only.
# Environment-specific paths and credentials are in .env (see .env.example).

agent:
  model: qwen3.5-35b-a3b
  max_steps: 32
  min_steps: 4
  temperature: 0.0

run:
  # 3-attempt union enabled: workers=4 outer × 3 inner = 12 concurrent vLLM
  # streams. Matches exp_086 (R1 official) and exp_087 stable point.
  max_workers: 4
  task_timeout_seconds: 900
