# Experiment parameters only.
# Environment-specific paths and credentials are in .env (see .env.example).

agent:
  model: qwen3.5-35b-a3b
  max_steps: 32
  min_steps: 4
  temperature: 0.0

run:
  # workers=5 outer × 3 inner attempts = 15 concurrent vLLM streams. Lower
  # saturation than workers=20; trades throughput (= longer wall clock,
  # likely 2-3 h) for lower per-request latency variance.
  max_workers: 5
  task_timeout_seconds: 900
